[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btqc"
version = "0.1.0"
description = "Uncertainty-gated brain tumor segmentation across hospitals (research prototype, not a medical device)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "nibabel>=5.2",
    "pandas>=2.1",
    "pyyaml>=6",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
train = ["torch>=2.2", "nnunetv2>=2.5", "SimpleITK>=2.3", "mlflow>=2.12"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27", "playwright>=1.44", "pre-commit>=3.7",
       "types-PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running test",
    "ui: browser tests (Playwright)",
    "realdata: needs the raw data root (BTQC_RAW_ROOT)",
    "torch: needs torch",
    "nnunet: needs nnunetv2",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "NPY", "RUF"]
ignore = ["S101", "S311", "S603", "S607", "RUF001", "RUF002", "RUF003", "B905", "B008", "UP031", "NPY002", "RUF005"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"scripts/**" = ["S"]
"scripts/build_report.py" = ["S", "E501"]  # report prose

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
no_implicit_optional = true
check_untyped_defs = true
files = ["src"]

[tool.coverage.run]
source = ["btqc"]
omit = ["src/btqc/research_assist/*"]
