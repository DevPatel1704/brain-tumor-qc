# App + MLflow UI. Data, results and runs are bind-mounted from the host and never baked into images.
services:
  app:
    build: {context: .., dockerfile: docker/Dockerfile.app}
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ../data:/app/data
      - ../results:/app/results
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    command: mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlruns/mlflow.db
    ports: ["127.0.0.1:5000:5000"]
    volumes:
      - ../mlruns:/mlruns
