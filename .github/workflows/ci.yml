name: ci
# Synthetic fixtures only: no real data, no GPU.
on:
  push:
  pull_request:

jobs:
  lint-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-ci.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e . --no-deps
      - run: ruff check src tests scripts
      - run: mypy

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-ci.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e . --no-deps
      - run: python -m pytest -m "not ui and not realdata and not slow" --cov=btqc --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        with: {name: coverage, path: coverage.xml}

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-ci.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e . --no-deps
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/ui -m ui

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile.app -t btqc-app .
      - run: docker run --rm btqc-app python -m pytest -q tests/unit -m "not torch"
